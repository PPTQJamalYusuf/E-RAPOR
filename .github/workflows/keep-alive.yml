name: Keep Supabase Alive

on:
  schedule:
    # Berjalan setiap 3 hari sekali pada jam 00:00 UTC (07:00 WIB)
    - cron: '0 0 */3 * *'
  workflow_dispatch: # Tombol manual trigger di GitHub Actions tab

jobs:
  ping-supabase:
    runs-on: ubuntu-latest
    steps:
      - name: Ping Supabase Database
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL || 'https://srsooqrhledihkftdqpm.supabase.co' }}
          SUPABASE_ANON_KEY: ${{ secrets.SUPABASE_ANON_KEY }}
        run: |
          KEY="${SUPABASE_ANON_KEY:-sb_publishable_OeZVBu78zMKVlHT9Qo_WDQ_i8NF7X3W}"
          RESPONSE=$(curl -s -o /dev/null -w "%{http_code}" -X GET "${SUPABASE_URL}/rest/v1/academic_periods?select=id&limit=1" \
            -H "apikey: ${KEY}" \
            -H "Authorization: Bearer ${KEY}")
          echo "Supabase HTTP Response Status: $RESPONSE"
          if [ "$RESPONSE" -ge 200 ] && [ "$RESPONSE" -lt 400 ]; then
            echo "Successfully pinged Supabase! Database remains active."
          else
            echo "Warning: Response code $RESPONSE"
            exit 1
          fi
